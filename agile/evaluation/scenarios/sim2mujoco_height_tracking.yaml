evaluation:
  task_name: HeightTracking-G1-v0
  num_envs: 1
  episode_length_s: 12.0
  num_episodes: 1
  environments:
    - env_ids: [0]
      name: stand_lie_down_stand_up
      schedule:
        - time: 0.0
          commands:
            height:
              height: 0.72
      ramps:
        - start_time: 2.0
          duration_s: 4.0
          interval_s: 0.25
          commands:
            height:
              height: [0.72, -0.5]
        - start_time: 6.0
          duration_s: 4.0
          interval_s: 0.25
          commands:
            height:
              height: [-0.5, 0.72]
