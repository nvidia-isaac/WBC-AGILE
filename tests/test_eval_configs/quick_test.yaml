# Quick test config for CI - deterministic evaluation system test
# Note: Height map terrain initialization can take 3-4 minutes in CI
evaluation:
  task_name: "Velocity-Height-G1-History-v0"
  num_envs: 2
  episode_length_s: 2.5 # Very short episode for CI speed
  num_episodes: 1
  # Environment overrides for deterministic testing
  env_overrides:
    events:
      disable_interval_events: true # Disable disturbances for reproducibility
  environments:
    # Environment 0: X-velocity sweep
    - env_ids: [0]
      name: "quick_x_test"
      sweep:
        interval: 1.25 # Change every 1.25 seconds
        commands:
          base_velocity:
            lin_vel_x: [0.0, 0.5]
            lin_vel_y: 0.0
            ang_vel_z: 0.0
            base_height: 0.72
    # Environment 1: Height sweep
    - env_ids: [1]
      name: "quick_height_test"
      sweep:
        interval: 1.25
        commands:
          base_velocity:
            lin_vel_x: 0.0
            lin_vel_y: 0.0
            ang_vel_z: 0.0
            base_height: [0.65, 0.72]
